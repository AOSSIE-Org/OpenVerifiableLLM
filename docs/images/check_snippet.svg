<svg xmlns="http://www.w3.org/2000/svg" width="575" height="330" viewBox="0 0 575 330" role="img" aria-label="Terminal session checking the released model: the weights match chain entry 37, and a recomputed training segment matches bit for bit.">
  <rect width="575" height="330" rx="10" fill="#0f1a14"/>
  <rect width="575" height="30" rx="10" fill="#17291f"/>
  <rect y="20" width="575" height="10" fill="#17291f"/>
  <circle cx="20" cy="15" r="5" fill="#00853f"/>
  <circle cx="38" cy="15" r="5" fill="#ffcc00"/>
  <circle cx="56" cy="15" r="5" fill="#3a5446"/>
  <g xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#d7e3dc">
    <text x="18" y="56" fill="#7f9a8b"># Any machine: the published weights are the committed ones</text>
    <text x="18" y="78"><tspan fill="#ffcc00">$</tspan> sha256sum -c release-hashes.txt</text>
    <text x="18" y="96">conversation-model.pt: <tspan fill="#3ddc84">OK</tspan>   <tspan fill="#7f9a8b">… every file OK</tspan></text>
    <text x="18" y="118"><tspan fill="#ffcc00">$</tspan> python simple/ovl.py verify --run . \</text>
    <text x="18" y="136">      --weights conversation-model.pt</text>
    <text x="18" y="154">weights conversation-model.pt: <tspan fill="#3ddc84">MATCH chain entry 37</tspan></text>
    <text x="18" y="172">verify <tspan fill="#3ddc84">PASS</tspan>: 1 checks; 0 of 37 segments</text>
    <text x="18" y="206" fill="#7f9a8b"># RTX 5090: recompute one training segment, bit for bit</text>
    <text x="18" y="228"><tspan fill="#ffcc00">$</tspan> K=1 bash simple/verify_segment.sh</text>
    <text x="18" y="246">initialization: <tspan fill="#3ddc84">MATCH</tspan></text>
    <text x="18" y="264">segment 8-&gt;9 (progress): <tspan fill="#3ddc84">MATCH</tspan> in 1139 s</text>
    <text x="18" y="282">verify <tspan fill="#3ddc84">PASS</tspan>: 2 checks; 1 of 37 segments</text>
    <text x="18" y="312" fill="#7f9a8b"># segments check in any order, by anyone: 37 of 37 MATCH</text>
  </g>
</svg>
