[project]
name = "openverifiablellm"
version = "1.1.0"
description = "Train a small language model on English Wikipedia so that anyone can recompute it bit for bit."
readme = "README.md"
requires-python = ">=3.12"
# Pinned with hashes in requirements/preparation.lock, which CI installs.
dependencies = ["torch>=2.10.0,<3.0", "numpy>=2.4,<3.0", "tokenizers==0.23.2"]

[project.optional-dependencies]
gguf = ["gguf"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# The training loop uses a compact style: short statements joined on one line, `l` for lines.
ignore = ["E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# ovl.py puts simple/ on sys.path before importing its modules. The zips in ovl.py and data.py run on
# the training data path, which stays byte-for-byte as released.
"simple/ovl.py" = ["E402", "B905"]
"simple/data.py" = ["B905"]
