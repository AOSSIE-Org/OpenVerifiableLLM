# Dependabot version updates, for the GitHub Actions only.
# The Python dependencies are pinned by hash in requirements/preparation.lock, which is evidence for
# the published run, so they are updated by hand, never automatically. A pip update here would only
# change preparation.in or pyproject.toml and leave the lock behind (as in #232 and #233).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

