name: Production progress endorsement
on:
  push:
    branches: [feat/verifiable-wikipedia-pipeline]
    paths:
      - .github/workflows/anchor-progress.yml
      - src/ovl_pipeline/progress_*.py
      - requirements/endorsement.*
      - project/progress-commitments/**
permissions:
  contents: read
concurrency:
  group: pipeline-progress-endorsement
  cancel-in-progress: false
jobs:
  endorse-progress:
    if: github.repository == 'AOSSIE-Org/OpenVerifiableLLM' && github.event_name == 'push' && github.ref == 'refs/heads/feat/verifiable-wikipedia-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-locked verifier dependencies
        run: python -m pip install --require-hashes -r requirements/preparation.lock -r requirements/endorsement.lock
      - name: Select new append-only progress request
        id: request
        run: python -m ovl_pipeline.progress_commitment --select >> "$GITHUB_OUTPUT"
      - name: Verify prior endorsements and actual public checkpoint bytes
        if: steps.request.outputs.present == 'true'
        id: inputs
        run: |
          python -m ovl_pipeline.progress_commitment
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value=json.loads(Path('anchor-progress/current.json').read_text())
          print('statement=anchor-progress/'+value['statement'])
          print('bundle=anchor-progress/'+value['bundle'])
          PY
      - name: Endorse exact progress assertion with GitHub Actions OIDC
        if: steps.request.outputs.present == 'true'
        run: >-
          python -m sigstore sign
          --bundle "${{ steps.inputs.outputs.bundle }}"
          "${{ steps.inputs.outputs.statement }}"
      - name: Recompute complete progress-prefix signatures
        if: steps.request.outputs.present == 'true'
        run: python -m ovl_pipeline.progress_commitment --verify-output
      - name: Preserve temporary signing outputs for public archival
        if: always() && steps.request.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-production-progress-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            anchor-progress/request.json
            anchor-progress/current.json
            anchor-progress/ci-*.json
            anchor-progress/progress/
            anchor-progress/registration-packet/
            anchor-progress/registration-anchor/
          if-no-files-found: error
          retention-days: 90
