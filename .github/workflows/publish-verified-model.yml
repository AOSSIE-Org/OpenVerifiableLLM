name: Publish Verified Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Name to put in ovllm_manifest.json"
        required: true
        default: "openverifiable-smoke"
      hf_repo_id:
        description: "Optional Hugging Face repo id, e.g. owner/openverifiable-smoke"
        required: false
        default: ""
      publish_to_hf:
        description: "Upload the signed directory to Hugging Face"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Build tiny safetensors artifact
        run: |
          python - <<'PY'
          import torch
          from safetensors.torch import save_file

          weights = {
              "embed.weight": torch.arange(32, dtype=torch.float32).reshape(8, 4),
              "head.bias": torch.linspace(-1, 1, steps=8, dtype=torch.float32),
          }
          save_file(weights, "openverifiable-smoke.safetensors")
          PY

      - name: Prepare publish directory
        run: |
          ovllm prepare-publish \
            --weights openverifiable-smoke.safetensors \
            --out dist/openverifiable-smoke \
            --name "${{ inputs.model_name }}"

      - name: Sign with GitHub Actions OIDC
        env:
          SIGSTORE_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/publish-verified-model.yml@${{ github.ref }}"
          SIGSTORE_IDENTITY_PROVIDER: "https://token.actions.githubusercontent.com"
        run: |
          ovllm sign dist/openverifiable-smoke \
            --identity "$SIGSTORE_IDENTITY" \
            --identity-provider "$SIGSTORE_IDENTITY_PROVIDER" \
            --use-ambient-credentials

      - name: Verify signed artifact
        run: ovllm verify dist/openverifiable-smoke --skip-replay

      - name: Upload signed model directory
        uses: actions/upload-artifact@v4
        with:
          name: openverifiable-smoke-signed
          path: dist/openverifiable-smoke

      - name: Publish to Hugging Face
        if: ${{ inputs.publish_to_hf && inputs.hf_repo_id != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ovllm publish-hf "${{ inputs.hf_repo_id }}" dist/openverifiable-smoke
