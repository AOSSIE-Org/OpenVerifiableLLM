name: Final model release endorsement
on:
  push:
    branches: [feat/verifiable-wikipedia-pipeline]
    paths:
      - .github/workflows/release-models.yml
      - src/ovl_pipeline/release_*.py
      - src/ovl_pipeline/production_release.py
      - project/release-commitments/**
permissions:
  contents: read
concurrency:
  group: pipeline-release-endorsement
  cancel-in-progress: false
jobs:
  endorse-release:
    if: github.repository == 'AOSSIE-Org/OpenVerifiableLLM' && github.event_name == 'push' && github.ref == 'refs/heads/feat/verifiable-wikipedia-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-locked verifier dependencies
        run: python -m pip install --require-hashes -r requirements/preparation.lock -r requirements/endorsement.lock
      - name: Select new append-only release request
        id: request
        run: python -m ovl_pipeline.release_commitment --select >> "$GITHUB_OUTPUT"
      - name: Check public ancestry, report parents and actual final checkpoint bytes
        if: steps.request.outputs.present == 'true'
        run: python -m ovl_pipeline.release_commitment
      - name: Endorse the operator release inventory
        if: steps.request.outputs.present == 'true'
        run: python -m sigstore sign --bundle anchor-release/release.sigstore.json anchor-release/release.json
      - name: Recheck exact release signature and publisher identity
        if: steps.request.outputs.present == 'true'
        run: python -m ovl_pipeline.release_commitment --verify-output
      - name: Preserve signing outputs for immutable public archival
        if: always() && steps.request.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-model-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            anchor-release/release.json
            anchor-release/release.sigstore.json
            anchor-release/ci-*.json
          if-no-files-found: error
          retention-days: 90
