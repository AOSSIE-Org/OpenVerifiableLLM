name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  falsifiability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # Install the CPU wheel explicitly so CI doesn't pull the multi-GB CUDA build.
          pip install --require-hashes -r requirements/preparation.lock
          pip install pytest pytest-cov ruff gguf safetensors

      - name: Ruff
        run: ruff check simple tests

      - name: Tests
        env:
          TOKENIZERS_PARALLELISM: "false"
          OVL_DEVICE: cpu
          OVL_TIMESTAMP: "0"
        run: |
          python -m pytest -q -rs tests --cov=simple --cov-report=term
          python -m coverage report --format=markdown --include='simple/*' >> "$GITHUB_STEP_SUMMARY"
