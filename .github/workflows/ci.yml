name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  falsifiability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # Install the CPU wheel explicitly so CI doesn't pull the multi-GB CUDA build.
          pip install --require-hashes -r requirements/preparation.lock
          pip install pytest pytest-cov ruff gguf safetensors

      - name: Ruff
        run: ruff check simple tests

      - name: Tests
        env:
          TOKENIZERS_PARALLELISM: "false"
          OVL_DEVICE: cpu
          OVL_TIMESTAMP: "0"
        run: |
          python -m pytest -q -rs tests --cov=simple --cov-report=term
          python -m coverage report --format=markdown --include='simple/*' >> "$GITHUB_STEP_SUMMARY"
