name: Production registration endorsement
on:
  push:
    branches: [feat/verifiable-wikipedia-pipeline]
    paths:
      - .github/workflows/anchor-production.yml
      - src/ovl_pipeline/production_*.py
      - requirements/endorsement.*
      - project/production-commitments/**
permissions:
  contents: read
concurrency:
  group: pipeline-production-endorsement
  cancel-in-progress: false
jobs:
  endorse-registration:
    if: github.repository == 'AOSSIE-Org/OpenVerifiableLLM' && github.event_name == 'push' && github.ref == 'refs/heads/feat/verifiable-wikipedia-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-locked verification dependencies
        run: python -m pip install --require-hashes -r requirements/preparation.lock -r requirements/endorsement.lock
      - name: Select new append-only registration request
        id: request
        run: python -m ovl_pipeline.production_commitment --select >> "$GITHUB_OUTPUT"
      - name: Download public packet and check source endorsement and report parents
        if: steps.request.outputs.present == 'true'
        run: python -m ovl_pipeline.production_commitment
      - name: Endorse operator registration with ambient GitHub Actions OIDC
        if: steps.request.outputs.present == 'true'
        run: >-
          python -m sigstore sign
          --bundle anchor-production/registration.sigstore.json
          anchor-production/packet/registration.json
      - name: Recompute both signatures and report relationships
        if: steps.request.outputs.present == 'true'
        run: >-
          python -m ovl_pipeline.production_anchoring
          --packet anchor-production/packet
          --registration-bundle anchor-production/registration.sigstore.json
          --production-policy anchor-production/ci-self-check-policy.json
          --source-policy anchor-production/ci-source-policy.json
          --policy-origin ci-self-generated
          --source-checkout .
          > anchor-production/ci-verification.json
      - name: Retain temporary signing output for later public archival
        if: always() && steps.request.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-production-registration-${{ github.sha }}-${{ github.run_attempt }}
          path: anchor-production/
          if-no-files-found: error
          retention-days: 90
