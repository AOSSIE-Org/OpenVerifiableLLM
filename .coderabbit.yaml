# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for OpenVerifiableLLM (Python, PyTorch, shell).
language: en
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: false
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
    base_branches:
      - main
  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: off

  # Generated lock files; not worth reviewing line by line.
  path_filters:
    - "!requirements/*.lock"

  path_instructions:
    - path: "simple/**"
      instructions: >-
        This is the bit-exact training loop behind the released model. Flag any change to seeds,
        data order, dtype, kernel or determinism settings, RNG or optimizer state handling, or the
        serialization of chain.jsonl and checkpoints, because it changes hashes and breaks
        verification of the published run. Weights must load with torch.load(weights_only=True)
        or safetensors. Shell scripts must stay safe under `set -euo pipefail`.
    - path: "tests/**"
      instructions: >-
        Tests must run on a CPU with no network. Verification tests need both a passing and a
        tampered (failing) case.
    - path: "**/*.md"
      instructions: >-
        Check that commands are runnable as written, links resolve, and numbers (segments, costs,
        hashes) match docs/how-it-works.md.

  tools:
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true
